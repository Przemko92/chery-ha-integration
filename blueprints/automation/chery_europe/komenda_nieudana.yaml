blueprint:
  name: Chery Europe — Alert nieudanej komendy
  description: >
    Pokazuje popup w Home Assistant (i opcjonalnie wysyła powiadomienie push), gdy
    komenda wysłana do auta przez integrację **Chery Europe** nie przeszła: auto zajęte,
    niedostępne, limit zapytań, błąd sieci, wygasła sesja lub inny błąd.


    Reaguje tylko na prawdziwe błędy: sukces (✅) i kroki pośrednie są ignorowane.
    Komunikaty z ⏳ traktowane są jako „w toku”, nie jako błąd.


    Popup ma stałe id — kolejne błędy aktualizują to samo powiadomienie, a znika ono
    po pierwszej udanej komendzie.
  domain: automation
  author: Chery Europe
  homeassistant:
    min_version: 2024.10.0
  input:
    esito_sensor:
      name: "Sensor \"Wynik komendy\""
      description: >
        Sensor diagnostyczny z wynikiem ostatniej komendy na urządzeniu pojazdu.
      selector:
        entity:
          integration: chery_europe
          domain: sensor
    popup_ha:
      name: Popup w Home Assistant
      description: Trwałe powiadomienie widoczne w aplikacji i przeglądarce HA.
      default: true
      selector:
        boolean: {}
    push_service:
      name: Powiadomienie push (opcjonalnie)
      description: >
        Usługa notify, np. `notify.mobile_app_moj_telefon`. Puste = bez push.
      default: ""
      selector:
        text: {}

mode: queued
max: 10
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input esito_sensor

variables:
  esito: "{{ trigger.to_state.state if trigger is defined and trigger.to_state is defined else '' }}"
  riuscito: "{{ '✅' in esito }}"
  fallito: >
    {{ esito not in ['unknown', 'unavailable', ''] and not riuscito and (
         '❌' in esito or '🚫' in esito
         or 'failed' in esito or 'fallit' in esito
         or 'network error' in esito) }}
  popup_ha: !input popup_ha
  push_service: !input push_service

conditions:
  - condition: template
    value_template: "{{ fallito or riuscito }}"

actions:
  - if:
      - condition: template
        value_template: "{{ riuscito }}"
    then:
      - action: persistent_notification.dismiss
        data:
          notification_id: chery_europe_command_failed
    else:
      - if:
          - condition: template
            value_template: "{{ popup_ha }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: chery_europe_command_failed
              title: "❌ Nieudana komenda Chery"
              message: >
                **{{ esito }}**


                Spróbuj ponownie za chwilę. Jeśli auto jest zajęte, poczekaj na zakończenie
                poprzedniej komendy. Przy wygasłej sesji przejdź ponowną autoryzację integracji.


                _aktualizacja {{ now().strftime('%H:%M:%S') }}_
      - if:
          - condition: template
            value_template: "{{ push_service | trim != '' }}"
        then:
          - action: "{{ push_service }}"
            data:
              title: "❌ Nieudana komenda Chery"
              message: "{{ esito }}"

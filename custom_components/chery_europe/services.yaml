send_command:
  name: Send command
  description: Send a remote command to the Chery Europe vehicle. Uses the PIN from the service call or from integration options.
  fields:
    vin:
      name: VIN
      description: Vehicle VIN. Required when more than one vehicle is configured on this account.
      required: false
      selector:
        text:
    command_id:
      name: Command ID
      description: Chery Europe remote command identifier to send, for example ve_1101 for horn.
      required: true
      example: "ve_1101"
      selector:
        text:
    pin:
      name: PIN
      description: Vehicle remote-control PIN. Optional when a PIN is stored in integration options.
      required: false
      selector:
        text:
          type: password
    level:
      name: Level
      description: Seat heating/ventilation level for ve_1204 (1-3, default 3). Used with seat_field and enabled.
      required: false
      example: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box
    duration:
      name: Climate runtime
      description: How long the air conditioning should run after a remote start, in minutes (airControl "times").
      required: false
      example: "15"
      default: "15"
      selector:
        select:
          options:
            - "5"
            - "10"
            - "15"

set_scheduled_charging:
  name: Set scheduled charging
  description: Enable or update the vehicle charging schedule. Uses the PIN from integration options.
  fields:
    start_time:
      name: Start time
      description: Local time when charging should start.
      required: true
      example: "23:00:00"
      selector:
        time:
    duration_hours:
      name: Duration
      description: How long charging should run, in hours (1–24, steps of 15 minutes).
      required: true
      example: 6
      default: 6
      selector:
        number:
          min: 1
          max: 24
          step: 0.25
          unit_of_measurement: h
    enabled:
      name: Enabled
      description: Set to false to disable the charging schedule.
      required: false
      default: true
      selector:
        boolean:
    vin:
      name: VIN
      description: Vehicle VIN. Required when more than one vehicle is configured on this account.
      required: false
      selector:
        text:

set_prepare_plan:
  name: Set preparation plan
  description: >-
    Create or update a scheduled departure plan. The car accepts at most 5 plans,
    names of 10 characters and departures at least 20 minutes apart. The vehicle
    stores the time, weekdays and on/off switch. Cabin temperature and the comfort
    switches are kept with the plan in Home Assistant; appointmentTravel does not
    accept them.
  fields:
    plan_name:
      name: Plan name
      description: Short name of the plan, at most 10 characters and unique.
      required: true
      example: "Work"
      selector:
        text:
    travel_time:
      name: Departure time
      description: Local time you want the car ready.
      required: true
      example: "07:30"
      selector:
        time:
    repeat:
      name: Repeat
      description: How often the plan runs.
      required: false
      default: daily
      selector:
        select:
          options:
            - daily
            - workdays
            - weekend
            - custom
    days:
      name: Days
      description: Weekdays used when repeat is custom (1 = Monday, 7 = Sunday).
      required: false
      selector:
        select:
          multiple: true
          options: ["1", "2", "3", "4", "5", "6", "7"]
    enabled:
      name: Enabled
      description: Set to false to keep the plan but switch it off.
      required: false
      default: true
      selector:
        boolean:
    temperature:
      name: Cabin temperature
      description: Target cabin temperature in °C.
      required: false
      example: 22
      selector:
        number:
          min: 16
          max: 32
          step: 0.5
          unit_of_measurement: "°C"
    battery_heat:
      name: Battery heating
      description: Pre-heat the high-voltage battery before departure.
      required: false
      default: false
      selector:
        boolean:
    steering_wheel_heat:
      name: Steering wheel heating
      description: Heat the steering wheel before departure.
      required: false
      default: false
      selector:
        boolean:
    driver_seat_heat:
      name: Driver seat heating
      description: Heat the driver seat before departure.
      required: false
      default: false
      selector:
        boolean:
    front_defrost:
      name: Front defrost
      description: Defrost the windscreen before departure.
      required: false
      default: false
      selector:
        boolean:
    rear_defrost:
      name: Rear defrost
      description: Defrost the rear window before departure.
      required: false
      default: false
      selector:
        boolean:
    plan_id:
      name: Plan id
      description: Existing plan to edit; omit to add a new plan.
      required: false
      selector:
        text:
    dry_run:
      name: Dry run
      description: Only build and return the payload, do not send it to the car.
      required: false
      default: false
      selector:
        boolean:
    pin:
      name: PIN
      description: Vehicle remote-control PIN. Optional when a PIN is stored in integration options.
      required: false
      selector:
        text:
          type: password
    vin:
      name: VIN
      description: Vehicle VIN. Required when more than one vehicle is configured on this account.
      required: false
      selector:
        text:

cancel_prepare_plan:
  name: Cancel preparation plan
  description: Switch a preparation plan off. The car requires deactivation instead of deletion.
  fields:
    plan_id:
      name: Plan id
      description: Identifier of the plan to switch off, as returned by list_prepare_plans.
      required: true
      selector:
        text:
    dry_run:
      name: Dry run
      description: Only build and return the payload, do not send it to the car.
      required: false
      default: false
      selector:
        boolean:
    pin:
      name: PIN
      description: Vehicle remote-control PIN. Optional when a PIN is stored in integration options.
      required: false
      selector:
        text:
          type: password
    vin:
      name: VIN
      description: Vehicle VIN. Required when more than one vehicle is configured on this account.
      required: false
      selector:
        text:

list_prepare_plans:
  name: List preparation plans
  description: Read the preparation plans stored in the car and return them in the service response.
  fields:
    vin:
      name: VIN
      description: Vehicle VIN. Required when more than one vehicle is configured on this account.
      required: false
      selector:
        text:

get_messages:
  name: Get messages
  description: Return a page of the stored message history. Reads the local copy only, no request is sent to the Chery cloud.
  fields:
    vin:
      name: VIN
      description: Vehicle VIN. Required when more than one vehicle is configured on this account.
      required: false
      selector:
        text:
    page:
      name: Page
      description: Page number, starting at 1. Newest messages come first.
      required: false
      default: 1
      selector:
        number:
          min: 1
          mode: box
    page_size:
      name: Page size
      description: Messages per page (1-500, default 50).
      required: false
      default: 50
      selector:
        number:
          min: 1
          max: 500
          mode: box
    unread_only:
      name: Unread only
      description: Return only the messages that are still unread.
      required: false
      default: false
      selector:
        boolean:

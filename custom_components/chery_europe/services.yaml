send_command:
  name: Send command
  description: Send a remote command to a Chery Europe vehicle. Uses the PIN from the service call or from integration options.
  fields:
    vin:
      name: VIN
      description: Vehicle identification number for the target vehicle.
      required: true
      example: "LVVDB21B0PD123456"
      selector:
        text:
    command_id:
      name: Command ID
      description: Chery Europe remote command identifier to send, for example ve_1101 for horn.
      required: true
      example: "ve_1101"
      selector:
        text:
    pin:
      name: PIN
      description: Vehicle remote-control PIN. Optional when a PIN is stored in integration options.
      required: false
      selector:
        text:
          type: password

set_scheduled_charging:
  name: Set scheduled charging
  description: Enable or update the vehicle charging schedule. Uses the PIN from integration options.
  fields:
    start_time:
      name: Start time
      description: Local time when charging should start.
      required: true
      example: "23:00:00"
      selector:
        time:
    duration_hours:
      name: Duration
      description: How long charging should run, in hours (1–12).
      required: true
      example: 6
      default: 6
      selector:
        number:
          min: 1
          max: 12
          step: 1
          unit_of_measurement: h
    enabled:
      name: Enabled
      description: Set to false to disable the charging schedule.
      required: false
      default: true
      selector:
        boolean:
